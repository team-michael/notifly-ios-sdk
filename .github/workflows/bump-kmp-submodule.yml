name: Bump KMP submodule

on:
  workflow_dispatch:
    inputs:
      kmp_version:
        description: "Published KMP release tag (for example, v0.1.0-alpha.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kmp-submodule-bump-${{ inputs.kmp_version }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate release tag and PR credentials
        id: validate
        env:
          KMP_VERSION: ${{ inputs.kmp_version }}
          SDK_REPO_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          if [[ ! "$KMP_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Expected a KMP release tag such as v0.1.0-alpha.4." >&2
            exit 1
          fi
          if [[ -z "$SDK_REPO_TOKEN" ]]; then
            echo "SDK_REPO_TOKEN is required with Contents and Pull requests write access." >&2
            echo "Use a PAT or GitHub App token so the new branch and PR trigger SDK CI." >&2
            exit 1
          fi

      - name: Checkout SDK default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a published KMP release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          KMP_VERSION: ${{ inputs.kmp_version }}
        run: |
          gh release view "$KMP_VERSION" --repo notifly-tech/notifly-kmp-sdk \
            --json tagName,isDraft |
            jq -e --arg tag "$KMP_VERSION" '.tagName == $tag and .isDraft == false'

      - name: Update the pinned KMP commit
        id: bump
        env:
          KMP_VERSION: ${{ inputs.kmp_version }}
        run: |
          expected_url="https://github.com/notifly-tech/notifly-kmp-sdk.git"
          actual_url="$(git config -f .gitmodules --get submodule.notifly-kmp-sdk.url)"
          if [[ "$actual_url" != "$expected_url" ]]; then
            echo "Unexpected notifly-kmp-sdk submodule source: $actual_url" >&2
            exit 1
          fi

          previous_sha="$(git rev-parse HEAD:notifly-kmp-sdk)"
          git submodule update --init -- notifly-kmp-sdk
          git -C notifly-kmp-sdk fetch --no-tags origin "refs/tags/$KMP_VERSION"
          next_sha="$(git -C notifly-kmp-sdk rev-parse 'FETCH_HEAD^{commit}')"

          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          echo "next_sha=$next_sha" >> "$GITHUB_OUTPUT"
          if [[ "$previous_sha" == "$next_sha" ]]; then
            echo "KMP $KMP_VERSION is already pinned; no PR is needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C notifly-kmp-sdk checkout --detach "$next_sha"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update the KMP bump PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # GITHUB_TOKEN-created pushes do not trigger the normal SDK CI workflows.
          token: ${{ secrets.SDK_REPO_TOKEN }}
          add-paths: notifly-kmp-sdk
          base: ${{ github.event.repository.default_branch }}
          branch: automation/bump-kmp-${{ inputs.kmp_version }}
          delete-branch: false
          commit-message: "chore: update KMP submodule to ${{ inputs.kmp_version }}"
          title: "chore: update KMP submodule to ${{ inputs.kmp_version }}"
          body: |
            Updates the pinned `notifly-kmp-sdk` source to [${{ inputs.kmp_version }}](https://github.com/notifly-tech/notifly-kmp-sdk/releases/tag/${{ inputs.kmp_version }}).

            - Previous commit: `${{ steps.bump.outputs.previous_sha }}`
            - New commit: `${{ steps.bump.outputs.next_sha }}`
            - [Review KMP changes](https://github.com/notifly-tech/notifly-kmp-sdk/compare/${{ steps.bump.outputs.previous_sha }}...${{ steps.bump.outputs.next_sha }})

            Only the submodule pointer changes. SDK versions are unchanged.
            Review and merge after SDK CI passes; this workflow does not merge or release SDKs.
