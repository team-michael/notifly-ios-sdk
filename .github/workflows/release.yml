name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to be released"
        required: true
      skip_cocoapods:
        description: "Skip CocoaPods release step"
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Read Changelog
        id: read_changelog
        if: ${{ !endsWith(github.event.inputs.version, 'SNAPSHOT') }}
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ github.event.inputs.version }}

      - name: Build distributable SDK
        run: |
          ./scripts/build_notifly_xcframework.sh
          ./scripts/verify_release_artifacts.sh
          ./scripts/test_distribution_boundary.sh
          ditto -c -k --sequesterRsrc --keepParent \
            Artifacts/notifly_sdk.xcframework \
            notifly_sdk.xcframework.zip

      - name: Create Release
        if: steps.read_changelog.outputs.changes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.read_changelog.outputs.changes }}
          artifacts: notifly_sdk.xcframework.zip
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # https://fuller.li/posts/automated-cocoapods-releases-with-ci/
      - name: Release to CocoaPods
        if: ${{ github.event.inputs.skip_cocoapods != 'true' }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          pod trunk push --allow-warnings notifly_sdk.podspec
          pod trunk push --allow-warnings notifly_sdk_push_extension.podspec
