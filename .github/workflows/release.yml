name: Release

permissions:
  contents: read

concurrency:
  group: ios-sdk-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to be released"
        required: true
      skip_cocoapods:
        description: "Skip CocoaPods release step"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    outputs:
      checksum: ${{ steps.package_core.outputs.checksum }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Build and smoke-test KMP Core
        run: |
          ./scripts/build_kmp_core_xcframework.sh
          ./scripts/smoke_notifly_kmp_sdk_host.sh

      - name: Package KMP Core
        id: package_core
        run: ./scripts/package_kmp_core_release.sh

      - name: Upload Core build artifact
        uses: actions/upload-artifact@v4
        with:
          name: notifly-core-release
          path: build/release/NotiflyCore.xcframework.zip
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Read Changelog
        id: read_changelog
        if: ${{ !endsWith(github.event.inputs.version, 'SNAPSHOT') }}
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ github.event.inputs.version }}

      - name: Download Core build artifact
        uses: actions/download-artifact@v4
        with:
          name: notifly-core-release
          path: build/release

      - name: Verify Core archive
        env:
          EXPECTED_CHECKSUM: ${{ needs.build.outputs.checksum }}
        run: |
          actual_checksum="$(swift package compute-checksum build/release/NotiflyCore.xcframework.zip)"
          if [[ "$actual_checksum" != "$EXPECTED_CHECKSUM" ]]; then
            echo "Core archive checksum does not match the build job." >&2
            exit 1
          fi

      - name: Pin release asset in package manifests
        id: release_commit
        env:
          VERSION: ${{ github.event.inputs.version }}
          CORE_CHECKSUM: ${{ needs.build.outputs.checksum }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/prepare_kmp_core_release.rb "$VERSION" "$CORE_CHECKSUM"
          git diff --check
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" |
            jq --arg ref "refs/tags/$VERSION" '[.[] | select(.ref == $ref)] | length')"
          if [[ "$existing_tag" != "0" ]]; then
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
            jq -e --arg version "$VERSION" '
              .tag_name == $version and .draft == false and
              ([.assets[] | select(.name == "NotiflyCore.xcframework.zip" and .state == "uploaded")] | length) == 1
            ' <<< "$release" > /dev/null

            git fetch --no-tags origin "refs/tags/$VERSION"
            sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
            parents="$(git show -s --format=%P "$sha")"
            if [[ "$sha" != "$GITHUB_SHA" && "$parents" != "$GITHUB_SHA" ]]; then
              echo "Existing release was not created from this source commit." >&2
              exit 1
            fi

            # Reuse the published archive, not a potentially non-identical rebuild.
            checksum="$(git show "$sha:Package.swift" |
              sed -nE 's/^let releasedCoreChecksum = "([0-9a-f]{64})"$/\1/p')"
            archive_dir="$(mktemp -d)"
            trap 'rm -rf "$archive_dir"' EXIT
            gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --pattern NotiflyCore.xcframework.zip --dir "$archive_dir"
            actual_checksum="$(swift package compute-checksum "$archive_dir/NotiflyCore.xcframework.zip")"
            if [[ "$actual_checksum" != "$checksum" ]]; then
              echo "Published Core archive does not match the tagged checksum." >&2
              exit 1
            fi
            ./scripts/prepare_kmp_core_release.rb "$VERSION" "$checksum"
            # Require identical source and manifests, including the Core pod checksum.
            git diff --exit-code "$sha" --
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create Git objects without moving a branch or exposing a release tag.
          tree="$(jq -n --arg base "$(git rev-parse "$GITHUB_SHA^{tree}")" \
            --rawfile package Package.swift --rawfile podspec notifly_core.podspec \
            '{base_tree: $base, tree: [
              {path: "Package.swift", mode: "100644", type: "blob", content: $package},
              {path: "notifly_core.podspec", mode: "100644", type: "blob", content: $podspec}
            ]}' | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            -f "message=chore: pin NotiflyCore $VERSION release asset" \
            -f "tree=$tree" -f "parents[]=$GITHUB_SHA" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "existing=false" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.release_commit.outputs.existing != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          commit: ${{ steps.release_commit.outputs.sha }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.read_changelog.outputs.changes }}
          artifacts: build/release/NotiflyCore.xcframework.zip
          artifactErrorsFailBuild: true
          immutableCreate: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance branch after release is available
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.sha }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
          if [[ "$current_sha" == "$RELEASE_COMMIT" ]]; then
            exit 0
          fi
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_COMMIT...$current_sha" --jq .status)"
          if [[ "$comparison" == "ahead" ]]; then
            echo "Branch already contains the release commit."
            exit 0
          fi
          if [[ "$comparison" != "behind" ]]; then
            echo "Branch diverged from the release commit; refusing to move it." >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" \
            -f "sha=$RELEASE_COMMIT" -F force=false

      # https://fuller.li/posts/automated-cocoapods-releases-with-ci/
      - name: Release to CocoaPods
        if: ${{ github.event.inputs.skip_cocoapods != 'true' }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          spec_dir="$(mktemp -d)"
          trap 'rm -rf "$spec_dir"' EXIT
          for pod_name in notifly_core notifly_sdk notifly_sdk_push_extension; do
            podspec="$pod_name.podspec"
            status="$(curl --silent --show-error --location --retry 3 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              --output "$spec_dir/published.json" --write-out '%{http_code}' \
              "https://trunk.cocoapods.org/api/v1/pods/$pod_name/specs/$VERSION")"
            case "$status" in
              200)
                pod ipc spec "$podspec" > "$spec_dir/local.json"
                # Trunk adds this publishing-tool metadata; all spec fields must match.
                if ! jq -e -s 'map(del(.pushed_with_swift_version)) | .[0] == .[1]' \
                  "$spec_dir/local.json" "$spec_dir/published.json" > /dev/null; then
                  echo "Published $pod_name@$VERSION differs from this release." >&2
                  exit 1
                fi
                echo "$pod_name@$VERSION is already published and matches; skipping."
                ;;
              404)
                pod trunk push --allow-warnings "$podspec"
                ;;
              *)
                echo "Could not check $pod_name@$VERSION (HTTP $status)." >&2
                exit 1
                ;;
            esac
          done
