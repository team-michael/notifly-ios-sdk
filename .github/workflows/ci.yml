name: iOS CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false

      - name: Test CocoaPods release ordering
        run: ruby scripts/test_cocoapods_release.rb

      - name: Cache Derived Data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/project.pbxproj', '**/*.xcscheme') }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint

      - name: Build and smoke-test KMP Core
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: |
          ./ci_scripts/ci_pre_xcodebuild.sh
          ./scripts/smoke_notifly_kmp_sdk_host.sh
          ./scripts/package_kmp_core_release.sh

      - name: Find Available iOS Simulator
        id: find_simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [
              device
              for runtime, entries in json.load(sys.stdin)["devices"].items()
              if ".iOS-" in runtime
              for device in entries
              if device["isAvailable"] and device["name"].startswith("iPhone")
          ]
          if not devices:
              sys.exit("No available iPhone simulator found for SDK tests.")
          device = next((device for device in devices if device["state"] == "Booted"), devices[0])
          print(device["udid"])
          ')"

          echo "simulator_id=$SIMULATOR_ID" >> $GITHUB_OUTPUT
          echo "Using simulator ID: $SIMULATOR_ID"

      - name: Build TestApp with the local Swift package
        run: |
          xcodebuild build \
            -project NotiflyExample/NotiflyTestApp.xcodeproj \
            -scheme NotiflyTestApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.find_simulator.outputs.simulator_id }}' \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

      - name: Run SDK Swift package tests
        run: |
          xcodebuild test \
            -scheme notifly_sdk-Package \
            -destination 'platform=iOS Simulator,id=${{ steps.find_simulator.outputs.simulator_id }}' \
            -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Code Review GPT
        uses: mattzcarey/code-review-gpt@844c8337f6e0042e557cf2632b6bd7f8d1cd96b6 # v0.8.0
        with:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: "gpt-4o"
          REVIEW_LANGUAGE: "Korean"
